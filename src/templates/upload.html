{% extends "base.html" %}
{% block title %}Загрузка продуктов{% endblock %}
{% block content %}
<div class="form-container">
    <h1>Загрузка продуктов</h1>
    {% if error %}
        <p style="color: red;">Ошибка: {{ error }}</p>
    {% endif %}
    <form method="post" enctype="multipart/form-data" action="/users/upload">
        <label for="file">Выберите текстовый файл</label>
        <!-- <label for="file">(формат: название,количество, например: Product A,100):</label> -->
        <input type="file" name="file" accept=".txt" required>
        <button type="submit">Загрузить</button>
    </form>
</div>
{% endblock %}
